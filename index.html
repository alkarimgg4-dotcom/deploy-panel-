<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Deploy Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f1115;
            color: #e6e6e6;
            min-height: 100vh;
        }

        /* Navbar */
        nav {
            background: #16181d;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #26282f;
        }
        nav .logo {
            font-weight: 700;
            font-size: 18px;
        }
        nav .logo span { color: #4f8cff; }
        nav .user {
            font-size: 13px;
            color: #888;
        }

        /* Container */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Header */
        .header h1 {
            font-size: 24px;
            margin-bottom: 6px;
        }
        .header p {
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }

        /* Card Form Deploy */
        .card {
            background: #16181d;
            border: 1px solid #26282f;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 16px;
            margin-bottom: 16px;
            color: #ccc;
        }

        label {
            display: block;
            font-size: 13px;
            color: #999;
            margin-bottom: 6px;
            margin-top: 14px;
        }
        input, select, textarea {
            width: 100%;
            padding: 11px 14px;
            background: #0f1115;
            border: 1px solid #2a2d35;
            border-radius: 8px;
            color: #e6e6e6;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: #4f8cff;
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        button {
            background: #4f8cff;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 18px;
            width: 100%;
        }
        button:hover {
            background: #3a78e8;
        }
        button:active {
            transform: scale(0.98);
        }

        /* List Deploy */
        .deploy-item {
            background: #16181d;
            border: 1px solid #26282f;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .deploy-item .info h3 {
            font-size: 15px;
            margin-bottom: 4px;
        }
        .deploy-item .info p {
            font-size: 12px;
            color: #777;
        }
        .badge {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
        }
        .badge.live {
            background: rgba(46, 204, 113, 0.15);
            color: #2ecc71;
        }
        .badge.building {
            background: rgba(241, 196, 15, 0.15);
            color: #f1c40f;
        }

        .btn-open {
            background: #2a2d35;
            color: #ccc;
            padding: 8px 14px;
            font-size: 12px;
            width: auto;
            margin: 0;
            border-radius: 6px;
        }
        .btn-open:hover {
            background: #353841;
        }

        /* Output */
        #output {
            margin-top: 16px;
            padding: 14px;
            background: #0f1115;
            border: 1px solid #2a2d35;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #7ee787;
            white-space: pre-wrap;
            display: none;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav>
        <div class="logo">⚡ <span>Deploy</span>Panel</div>
        <div class="user">guest@web</div>
    </nav>

    <div class="container">

        <!-- Header -->
        <div class="header">
            <h1>Deploy Website</h1>
            <p>Upload atau tempel kode HTML kamu, lalu deploy ke hosting.</p>
        </div>

        <!-- Form Deploy -->
        <div class="card">
            <h2>📦 Deploy Baru</h2>

            <label>Nama Project</label>
            <input type="text" id="namaProject" placeholder="contoh: web-portfolio">

            <label>Subdomain</label>
            <input type="text" id="subdomain" placeholder="contoh: portfolio-saya">

            <label>Platform Hosting</label>
            <select id="platform">
                <option value="vercel">▲ Vercel</option>
                <option value="netlify">◆ Netlify</option>
                <option value="github">🐙 GitHub Pages</option>
                <option value="cloudflare">☁️ Cloudflare Pages</option>
            </select>

            <label>Kode HTML (index.html)</label>
            <textarea id="kodeHtml" placeholder="<!DOCTYPE html>&#10;<html>&#10;<head><title>Web Saya</title></head>&#10;<body>&#10;  <h1>Halo Dunia</h1>&#10;</body>&#10;</html>"></textarea>

            <button onclick="deployWeb()">🚀 Deploy Sekarang</button>

            <div id="output"></div>
        </div>

        <!-- List Deploy -->
        <div class="card">
            <h2>📋 Project Kamu</h2>

            <div id="listDeploy">
                <div class="deploy-item">
                    <div class="info">
                        <h3>web-portfolio</h3>
                        <p>portfolio-saya.vercel.app</p>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span class="badge live">● LIVE</span>
                        <button class="btn-open">Buka</button>
                    </div>
                </div>

                <div class="deploy-item">
                    <div class="info">
                        <h3>landing-page</h3>
                        <p>landing-page.netlify.app</p>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span class="badge building">◐ BUILDING</span>
                        <button class="btn-open">Buka</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        function deployWeb() {
            const nama = document.getElementById('namaProject').value;
            const subdomain = document.getElementById('subdomain').value;
            const platform = document.getElementById('platform').value;
            const kode = document.getElementById('kodeHtml').value;
            const output = document.getElementById('output');

            if (!nama || !subdomain || !kode) {
                output.style.display = 'block';
                output.style.color = '#ff6b6b';
                output.textContent = '⚠️ Nama, subdomain, dan kode HTML wajib diisi!';
                return;
            }

            output.style.display = 'block';
            output.style.color = '#7ee787';
            output.textContent = '⏳ Mengirim ke ' + platform + '...\n';
            
            setTimeout(() => {
                output.textContent += '📦 Building project...\n';
            }, 800);

            setTimeout(() => {
                output.textContent += '✅ Berhasil deploy!\n';
                output.textContent += '🌐 URL: https://' + subdomain + '.' + platform + '.app';

                // Tambah ke list
                const list = document.getElementById('listDeploy');
                const item = document.createElement('div');
                item.className = 'deploy-item';
                item.innerHTML = `
                    <div class="info">
                        <h3>${nama}</h3>
                        <p>${subdomain}.${platform}.app</p>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <span class="badge live">● LIVE</span>
                        <button class="btn-open">Buka</button>
                    </div>
                `;
                list.prepend(item);
            }, 1800);
        }
    </script>

</body>
</html>
